# Learning OS — MkDocs (Material) configuration.
# Build/serve with the project venv:
#   cd /home/randagui/data/learning/site
#   ../.venv/bin/mkdocs serve      # local preview at http://127.0.0.1:8000
#   ../.venv/bin/mkdocs build      # static site into ./site_build (strict)
# See ../platform/RUNBOOK.md for the full command set (incl. gh-deploy).

site_name: Learning OS
site_description: >-
  A beginner-to-expert journey through Linux, systems, containers, Kubernetes,
  and AI infrastructure — video + standalone notes + runnable labs, free and public.
site_author: Learning OS
# site_url is set at deploy time (GitHub Pages URL). Left blank so local builds are clean.
copyright: Content is the learner's own work — reuse the framework, cite the sources.

# Keep the built static site out of the source tree (and out of curriculum/).
site_dir: site_build

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.tabs.link
    - search.suggest
    - search.highlight
  palette:
    # Light mode (default) — mirrors the curriculum PDF palette (navy primary).
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Noto Sans
    code: DejaVu Sans Mono
  icon:
    admonition:
      note: material/lightbulb-on
      example: material/flask

extra_css:
  - assets/extra.css
  # asciinema player (loaded from CDN on the live site; harmless for local builds).
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.8.0/dist/bundle/asciinema-player.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/asciinema-player@3.8.0/dist/bundle/asciinema-player.min.js
  - assets/casts.js

markdown_extensions:
  - meta
  - toc:
      permalink: true
      toc_depth: 3
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Enables `--8<-- "curriculum/.../file.md"` transclusion from the repo root
      # (used from Phase 1 onward to compose lesson pages from the 11 module files).
      base_path:
        - ..
      check_paths: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Full 13-stage / 39-module nav is filled in during Phase 1 (P1 Backbone).
# The pilot ships Home, the learning-method page, and the Module 01 vertical slice.
nav:
  - Home: index.md
  - How to learn: learn-how-to-learn.md
  - "Stage 1 — Foundations":
      - "Module 01 — Computer & OS Fundamentals": stage-01/module-01.md
